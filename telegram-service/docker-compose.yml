version: '3.8'

services:
  telegram-service:
    build: .
    container_name: telegram_mtproto_service
    restart: always
    ports:
      - "4000:4000"
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
    volumes:
      - ./data:/app/data
