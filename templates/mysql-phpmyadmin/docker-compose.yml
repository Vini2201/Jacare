version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jacare_db}
      MYSQL_USER: ${MYSQL_USER:-jacare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jacare_secret_123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: mysql_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"

volumes:
  mysql_data:
