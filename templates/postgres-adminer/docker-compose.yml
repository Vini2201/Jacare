version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jacare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jacare_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-jacare_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: postgres_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
