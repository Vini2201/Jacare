<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        display: ['Syne', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            primary: 'var(--primary-color)',
                            secondary: 'var(--secondary-color)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --primary-color: {{ brand.primary_color|default('#ffcc00') }};
            --secondary-color: {{ brand.secondary_color|default('#ff5722') }};
            --border-width: 6px;
        }
        
        body { 
            background-color: #f4f4f0; 
            color: #000000; 
            margin: 0;
            padding: 0;
            /* Dot grid clássico brutalista */
            background-image: radial-gradient(#000000 2px, transparent 2px);
            background-size: 40px 40px;
        }
        
        @page {
            size: 1920px 1080px;
            margin: 0;
        }

        .slide {
            width: 1920px;
            height: 1080px;
            page-break-after: always;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 3rem; /* 48px */
        }

        /* Brutalism Classes */
        .brutal-box {
            background-color: #ffffff;
            border: var(--border-width) solid #000000;
            box-shadow: 16px 16px 0px 0px #000000;
            border-radius: 0;
        }

        .brutal-box-primary {
            background-color: var(--primary-color);
            border: var(--border-width) solid #000000;
            box-shadow: 12px 12px 0px 0px #000000;
        }

        .brutal-box-secondary {
            background-color: var(--secondary-color);
            color: white;
            border: var(--border-width) solid #000000;
            box-shadow: -12px 12px 0px 0px #000000;
        }

        /* Linhas divisórias espessas */
        .thick-border {
            border-color: #000000;
            border-width: var(--border-width);
        }
    </style>
</head>
<body>

    <!-- CAPA -->
    <section class="slide">
        <div class="brutal-box w-full h-full flex flex-col relative">
            
            <header class="flex border-b-[6px] border-black">
                <div class="flex-1 p-8 border-r-[6px] border-black bg-brand-primary">
                    <h2 class="font-sans font-black text-4xl uppercase tracking-tighter">MANIFESTO</h2>
                </div>
                <div class="flex-[3] p-8 bg-white flex items-center">
                    <span class="font-sans font-bold text-2xl uppercase">Dossiê Estratégico 2026</span>
                </div>
                <div class="p-8 border-l-[6px] border-black bg-brand-secondary text-white flex items-center justify-center">
                    <i data-lucide="zap" class="w-10 h-10"></i>
                </div>
            </header>

            <div class="flex-1 flex p-20 items-center justify-center relative overflow-hidden bg-[#f4f4f0]">
                <!-- Abstract shapes -->
                <div class="absolute top-10 left-10 w-40 h-40 brutal-box-primary rounded-full"></div>
                <div class="absolute bottom-10 right-20 w-60 h-40 brutal-box-secondary"></div>

                <div class="z-10 text-center max-w-5xl">
                    <h1 class="font-display text-[9rem] font-extrabold leading-[0.9] uppercase mix-blend-difference text-white">
                        {{ title }}
                    </h1>
                </div>
            </div>

            <footer class="border-t-[6px] border-black flex">
                <div class="flex-1 p-8 text-3xl font-bold border-r-[6px] border-black bg-white">
                    CONFIDENCIAL
                </div>
                <div class="flex-1 p-8 text-3xl font-bold bg-white text-right">
                    #BRUTAL_IMPACT
                </div>
            </footer>
        </div>
    </section>

    <!-- SLIDES DINÂMICOS -->
    {% for slide in slides %}
    <section class="slide">
        <div class="brutal-box w-full h-full flex flex-col p-12 bg-white">
            
            <div class="flex justify-between items-start mb-16">
                <div class="brutal-box-primary px-8 py-4">
                    <span class="font-display text-4xl font-bold uppercase">0{{ loop.index }}</span>
                </div>
                <h2 class="font-display text-7xl font-extrabold uppercase w-3/4 text-right leading-[1.1]">
                    {{ slide.headline }}
                </h2>
            </div>

            <div class="flex-1 flex gap-12 mt-10">
                <div class="flex-1 bg-[#f4f4f0] border-[6px] border-black p-12 relative">
                    <!-- Fita brutalista no canto superior esquerdo -->
                    <div class="absolute top-0 left-0 bg-brand-secondary text-white font-bold py-2 px-6 border-r-[6px] border-b-[6px] border-black uppercase text-xl">
                        INFO
                    </div>
                    
                    <p class="mt-16 text-4xl font-sans font-bold leading-[1.4] text-black">
                        {{ slide.body_text }}
                    </p>
                </div>

                {% if slide.image_prompt %}
                <div class="flex-1 brutal-box p-0 overflow-hidden relative">
                    <!-- Marcação tipo fita crepe -->
                    <div class="absolute -top-10 -right-10 w-40 h-10 bg-brand-primary transform rotate-45 border-4 border-black z-10"></div>
                    <img src="{{ slide.image_prompt }}" class="w-full h-full object-cover filter contrast-125 saturate-0 sepia-[20%]" alt="Brutalist Visual" />
                </div>
                {% endif %}
            </div>
            
            <div class="w-full h-4 mt-12 bg-brand-primary border-[6px] border-black"></div>
        </div>
    </section>
    {% endfor %}

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
