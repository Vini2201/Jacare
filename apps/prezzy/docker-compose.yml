version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: 
      context: ./backend
    container_name: prezzy_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - jacare-network

  worker:
    build: 
      context: ./backend
    container_name: prezzy_worker
    volumes:
      - ./backend:/app
      - ./prezzy_prd.html:/app/app/templates/prezzy_prd.html
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: arq worker.WorkerSettings
    networks:
      - jacare-network

  frontend:
    build:
      context: ./frontend
    container_name: prezzy_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - api
    networks:
      - jacare-network

networks:
  jacare-network:
    external: true

volumes:
  redis_data:

